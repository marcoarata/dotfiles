# YADR tmux — conciso
# Prefijo Ctrl-A (C-b liberado)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Base 1 for windows/panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi copy-mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel

# Vim-aware h/j/k/l navigation (respects vim/nvim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Splits v/s + new-window en cwd
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# r reload, e/E sync panes
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"
bind e setw synchronize-panes on \; display "sync on"
bind E setw synchronize-panes off \; display "sync off"

# Truecolor + Solarized dark
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g status-bg colour235
set -g status-fg colour136
setw -g window-status-current-style fg=colour166,bg=default,bright
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour166
set -g message-style bg=colour235,fg=colour166

set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M"
set -g status-interval 5

# Mouse + clipboard
set -g mouse on
set -g set-clipboard on

# Override local opcional
if-shell "[ -f ~/.tmux.conf.user ]" "source-file ~/.tmux.conf.user"
