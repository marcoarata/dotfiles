name: ci

# Pinned runner images: `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19.
# A support claim should not change distro version under our feet, so the
# version is bumped deliberately (and the lanes re-verified) instead.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning bin/yadr bin/lib/*.sh bootstrap.sh platform/*.sh tests/smoke.sh tests/coverage.sh tests/coverage-hook.sh tests/helpers.bash
      - name: zsh syntax
        run: |
          sudo apt-get install -y -qq zsh
          for f in shell/*.zsh shell/zshrc bootstrap.sh bin/yadr; do zsh -n "$f"; done
      - name: bash syntax
        run: bash -n bin/yadr && bash -n bootstrap.sh && bash -n tests/smoke.sh && bash -n tests/coverage.sh && bash -n tests/coverage-hook.sh && bash -n tests/helpers.bash && for f in bin/lib/*.sh platform/*.sh; do bash -n "$f"; done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: bats
        run: |
          if [[ "$(uname -s)" == "Darwin" ]]; then brew install bats-core;
          else sudo apt-get update -qq && sudo apt-get install -y -qq bats zsh; fi
      - name: smoke
        run: bash tests/smoke.sh
      - name: bats
        run: bats tests/shell.bats tests/bootstrap.bats

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: bats + zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats zsh
      - name: line coverage floor (no external dependency)
        env:
          YADR_COV_REQUIRE: "1"
        run: bash tests/coverage.sh

  fault-injection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: bats + zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats zsh
      - name: injected failures must fail loudly, never lie
        run: bats tests/fault.bats

  arch-container:
    # Arch is a supported distro (platform/linux.sh drives pacman), and the
    # only way to test its branch for real is inside the distro. The unit
    # suites run here too, so portability claims cover Arch as well.
    runs-on: ubuntu-24.04
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: git (for actions/checkout)
        run: |
          pacman -Sy --noconfirm --needed git \
            || { pacman-key --init; pacman-key --populate archlinux; pacman -Sy --noconfirm --needed git; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: suite dependencies on Arch
        run: |
          # bricks the suites actually need: bats, zsh, curl and unzip
          # (fetch_verified_zip). Nothing else: the point is that they run on a
          # minimal machine.
          pacman -Syu --noconfirm --needed bats zsh curl unzip
      - name: smoke on Arch
        run: bash tests/smoke.sh
      - name: bats on Arch (shell, bootstrap, fault-injection)
        run: |
          set +e
          bats --print-output-on-failure tests/shell.bats tests/bootstrap.bats tests/fault.bats > "$RUNNER_TEMP/bats.log" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            # Job logs need a GitHub login; annotations do not. Surface the
            # failing tests and their assertion lines so a red lane is
            # diagnosable from the public checks page instead of only from a
            # log nobody without an account can open.
            grep -E '^(not ok|# .*(failed|not found|in test file))' "$RUNNER_TEMP/bats.log" \
              | sed 's/^/::error::/' | head -n 20
            tail -n 40 "$RUNNER_TEMP/bats.log"
          fi
          exit "$rc"
      - name: real install in an isolated HOME (pacman branch)
        run: |
          export FAKE_HOME=/tmp/yadr-home
          mkdir -p "$FAKE_HOME"
          HOME="$FAKE_HOME" YADR_HOME="$GITHUB_WORKSPACE" \
            bash "$GITHUB_WORKSPACE/bootstrap.sh" --local --yes
      - name: doctor must pass clean
        run: |
          export PATH="/tmp/yadr-home/.local/bin:$PATH"
          HOME=/tmp/yadr-home bash "$GITHUB_WORKSPACE/bin/yadr" version
          HOME=/tmp/yadr-home bash "$GITHUB_WORKSPACE/bin/yadr" doctor
      - name: what the install actually provided (readable without a login)
        run: |
          # A green lane should show its evidence. These lines become
          # annotations, which anyone can read; job logs need an account. A
          # "the install worked" that cannot be inspected is not evidence.
          export PATH="/tmp/yadr-home/.local/bin:$PATH"
          missing=""
          for t in nvim tmux rg fd fzf mise zsh; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          echo "::notice::tools: $(for t in nvim tmux rg fd fzf mise zsh; do printf '%s ' "$(command -v "$t" 2>/dev/null || echo MISSING)"; done)"
          echo "::notice::nvim: $(nvim --version | head -n1)"
          echo "::notice::zsh: $(zsh --version)"
          echo "::notice::Nerd Font: $(find /tmp/yadr-home/.local/share/fonts -type f 2>/dev/null | wc -l) file(s) under HOME, $(fc-list 2>/dev/null | grep -ci -e nerd -e jetbrains || true) visible to fontconfig (a headless container often sees 0: install_fonts warns in that case, it never fails)"
          echo "::notice::symlinks into HOME: $(find /tmp/yadr-home -maxdepth 1 -type l | wc -l)"
          [ -z "$missing" ] || { echo "::error::install did not provide:$missing"; exit 1; }
      - name: real install with moved XDG directories (ADR-005)
        run: |
          # The environment the path policy exists for: a desktop session
          # exports XDG_* and the user may have relocated them. A real install
          # must land its links where the tools read them -- not under
          # $HOME/.config -- and `doctor` must agree afterwards.
          export XDG_ROOT=/tmp/yadr-xdg
          export FAKE_HOME="$XDG_ROOT/home"
          rm -rf "$XDG_ROOT"; mkdir -p "$FAKE_HOME"
          export HOME="$FAKE_HOME"
          export XDG_CONFIG_HOME="$XDG_ROOT/config" XDG_DATA_HOME="$XDG_ROOT/data"
          export XDG_CACHE_HOME="$XDG_ROOT/cache" XDG_STATE_HOME="$XDG_ROOT/state"
          YADR_HOME="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh" --local --yes
          export PATH="$HOME/.local/bin:$PATH"
          fail=0
          for p in "$XDG_CONFIG_HOME/nvim" "$XDG_CONFIG_HOME/mise/config.toml" "$XDG_CONFIG_HOME/yadr/aliases.zsh"; do
            if [ ! -L "$p" ]; then echo "::error::not linked where the tool reads it: $p"; fail=1; fi
          done
          for p in "$XDG_DATA_HOME/bash-completion/completions/yadr" "$XDG_DATA_HOME/zsh/site-functions/_yadr" "$XDG_CONFIG_HOME/fish/completions/yadr.fish"; do
            if [ ! -s "$p" ]; then echo "::error::completion not written under the moved XDG dir: $p"; fail=1; fi
          done
          if [ -e "$HOME/.config/nvim" ]; then
            echo "::error::nvim config left in the HOME default ($HOME/.config/nvim)"; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "::notice::XDG moved: nvim config -> $(readlink "$XDG_CONFIG_HOME/nvim")"
          echo "::notice::XDG moved: nvim stdpath(config) -> $(nvim --clean --headless -c 'lua io.write(vim.fn.stdpath("config"))' -c qa 2>/dev/null)"
          bash "$GITHUB_WORKSPACE/bin/yadr" doctor

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: core install in isolated HOME
        run: |
          export FAKE_HOME="$RUNNER_TEMP/yadr-home"
          mkdir -p "$FAKE_HOME"
          HOME="$FAKE_HOME" YADR_HOME="$GITHUB_WORKSPACE" \
            bash "$GITHUB_WORKSPACE/bootstrap.sh" --local --yes
      - name: doctor must pass clean
        run: |
          export PATH="$RUNNER_TEMP/yadr-home/.local/bin:$PATH"
          HOME="$RUNNER_TEMP/yadr-home" bash "$GITHUB_WORKSPACE/bin/yadr" doctor
      - name: shell completions written for bash, zsh and fish
        run: |
          export HOME="$RUNNER_TEMP/yadr-home"
          # Resolve the destinations the way the install did (paths.sh follows
          # the ambient XDG_*), instead of assuming the default directories:
          # this runner exports a non-default XDG_CONFIG_HOME, so the fish file
          # is not under $HOME/.config.
          source "$GITHUB_WORKSPACE/bin/lib/paths.sh"
          for p in "$(bash_completion_file)" "$(zsh_completion_file)" "$(fish_completion_file)"; do
            if [ ! -s "$p" ]; then echo "::error::missing shell completion: $p"; exit 1; fi
            echo "::notice::completion: $p"
          done
      - name: reinstall is a no-op (idempotence)
        run: |
          export PATH="$RUNNER_TEMP/yadr-home/.local/bin:$PATH"
          HOME="$RUNNER_TEMP/yadr-home" bash "$GITHUB_WORKSPACE/bin/yadr" install core --yes
          HOME="$RUNNER_TEMP/yadr-home" bash "$GITHUB_WORKSPACE/bin/yadr" diff
