name: ci

# Pinned runner images: `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19.
# A support claim should not change distro version under our feet, so the
# version is bumped deliberately (and the lanes re-verified) instead.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning bin/yadr bin/lib/*.sh bootstrap.sh platform/*.sh tests/smoke.sh tests/coverage.sh tests/coverage-hook.sh tests/helpers.bash
      - name: zsh syntax
        run: |
          sudo apt-get install -y -qq zsh
          for f in shell/*.zsh shell/zshrc bootstrap.sh bin/yadr; do zsh -n "$f"; done
      - name: bash syntax
        run: bash -n bin/yadr && bash -n bootstrap.sh && bash -n tests/smoke.sh && bash -n tests/coverage.sh && bash -n tests/coverage-hook.sh && bash -n tests/helpers.bash && for f in bin/lib/*.sh platform/*.sh; do bash -n "$f"; done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: bats
        run: |
          if [[ "$(uname -s)" == "Darwin" ]]; then brew install bats-core;
          else sudo apt-get update -qq && sudo apt-get install -y -qq bats zsh; fi
      - name: smoke
        run: bash tests/smoke.sh
      - name: bats
        run: bats tests/shell.bats tests/bootstrap.bats

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bats + zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats zsh
      - name: line coverage floor (no external dependency)
        env:
          YADR_COV_REQUIRE: "1"
        run: bash tests/coverage.sh

  fault-injection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bats + zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats zsh
      - name: injected failures must fail loudly, never lie
        run: bats tests/fault.bats

  arch-container:
    # Arch is a supported distro (platform/linux.sh drives pacman), and the
    # only way to test its branch for real is inside the distro. The unit
    # suites run here too, so portability claims cover Arch as well.
    runs-on: ubuntu-24.04
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: git (for actions/checkout)
        run: |
          pacman -Sy --noconfirm --needed git \
            || { pacman-key --init; pacman-key --populate archlinux; pacman -Sy --noconfirm --needed git; }
      - uses: actions/checkout@v4
      - name: suite dependencies on Arch
        run: |
          # bricks the suites actually need: bats, zsh, curl and unzip
          # (fetch_verified_zip). Nothing else: the point is that they run on a
          # minimal machine.
          pacman -Syu --noconfirm --needed bats zsh curl unzip
      - name: smoke on Arch
        run: bash tests/smoke.sh
      - name: bats on Arch (shell, bootstrap, fault-injection)
        run: |
          set +e
          bats --print-output-on-failure tests/shell.bats tests/bootstrap.bats tests/fault.bats > "$RUNNER_TEMP/bats.log" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            # Job logs need a GitHub login; annotations do not. Surface the
            # failing tests and their messages so a red lane is diagnosable
            # from the public checks page instead of only from a log nobody
            # without an account can open.
            grep -E '^(not ok|# )' "$RUNNER_TEMP/bats.log" | sed 's/^/::error::/' | head -n 20
            tail -n 40 "$RUNNER_TEMP/bats.log"
          fi
          exit "$rc"
      - name: real install in an isolated HOME (pacman branch)
        run: |
          export FAKE_HOME=/tmp/yadr-home
          mkdir -p "$FAKE_HOME"
          HOME="$FAKE_HOME" YADR_HOME="$GITHUB_WORKSPACE" \
            bash "$GITHUB_WORKSPACE/bootstrap.sh" --local --yes
      - name: doctor must pass clean
        run: |
          export PATH="/tmp/yadr-home/.local/bin:$PATH"
          HOME=/tmp/yadr-home bash "$GITHUB_WORKSPACE/bin/yadr" doctor

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: core install in isolated HOME
        run: |
          export FAKE_HOME="$RUNNER_TEMP/yadr-home"
          mkdir -p "$FAKE_HOME"
          HOME="$FAKE_HOME" YADR_HOME="$GITHUB_WORKSPACE" \
            bash "$GITHUB_WORKSPACE/bootstrap.sh" --local --yes
      - name: doctor must pass clean
        run: |
          export PATH="$RUNNER_TEMP/yadr-home/.local/bin:$PATH"
          HOME="$RUNNER_TEMP/yadr-home" bash "$GITHUB_WORKSPACE/bin/yadr" doctor
      - name: reinstall is a no-op (idempotence)
        run: |
          export PATH="$RUNNER_TEMP/yadr-home/.local/bin:$PATH"
          HOME="$RUNNER_TEMP/yadr-home" bash "$GITHUB_WORKSPACE/bin/yadr" install core --yes
          HOME="$RUNNER_TEMP/yadr-home" bash "$GITHUB_WORKSPACE/bin/yadr" diff
